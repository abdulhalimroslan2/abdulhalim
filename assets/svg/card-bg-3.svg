<svg width="400" height="400" viewBox="0 0 400 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad3" cx="100%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ff1493" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff1493" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ff1493" fill-opacity="0.2"/>
    </pattern>
    <mask id="dotMask">
      <ellipse cx="400" cy="200" rx="150" ry="250" fill="white"/>
    </mask>
  </defs>
  <!-- Force Solid White Background -->
  <rect width="400" height="400" fill="#ffffff"/>
  <rect width="400" height="400" fill="url(#grad3)"/>
  <rect width="400" height="400" fill="url(#dots)" mask="url(#dotMask)"/>
</svg>
